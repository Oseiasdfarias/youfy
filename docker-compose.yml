services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: youfy
      POSTGRES_PASSWORD: youfy
      POSTGRES_DB: youfy
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U youfy"]
      interval: 3s
      retries: 10

volumes:
  pgdata:
