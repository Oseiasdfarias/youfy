services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: youfy
      POSTGRES_PASSWORD: youfy
      POSTGRES_DB: youfy
    ports: ["5433:5432"]
    volumes:
      - "pgdata:/var/lib/postgresql/data"
      - "./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U youfy"]
      interval: 3s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -c "pip install --quiet psycopg2-binary &&
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://youfy:youfy@postgres:5432/mlflow
      --default-artifact-root /mlruns"
    ports: ["5000:5000"]
    volumes: ["mlruns:/mlruns"]

volumes:
  pgdata:
  mlruns:
